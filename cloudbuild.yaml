# Cloud Build — triggered on push to main.
# Builds the Docker image, pushes to Artifact Registry, deploys to Cloud Run.
#
# Non-secret substitutions are managed in infra/cloud-build.tf (Terraform).
# Firebase API keys are read from Secret Manager via availableSecrets below.
#
# After first terraform apply, populate secret values:
#   echo -n "VALUE" | gcloud secrets versions add firebase-api-key \
#     --data-file=- --project=avid-factor-496115-d6
#   (repeat for all 6 prod secrets)

substitutions:
  _REGION: asia-east1
  _REGISTRY: asia-east1-docker.pkg.dev
  _REPO: course-final-paper-website
  _IMAGE: course-final-paper-website
  _SERVICE: course-final-paper-website

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-api-key/versions/latest
      env: FIREBASE_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/firebase-auth-domain/versions/latest
      env: FIREBASE_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/firebase-project-id/versions/latest
      env: FIREBASE_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/firebase-storage-bucket/versions/latest
      env: FIREBASE_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/firebase-messaging-sender-id/versions/latest
      env: FIREBASE_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/firebase-app-id/versions/latest
      env: FIREBASE_APP_ID

steps:
  # ── 1. Build image ───────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_APP_ID
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$$FIREBASE_API_KEY"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$$FIREBASE_AUTH_DOMAIN"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$$FIREBASE_STORAGE_BUCKET"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_MESSAGING_SENDER_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$$FIREBASE_APP_ID"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"
      - "."

  # ── 2. Push image ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - "--all-tags"
      - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}"

  # ── 3a. Deploy to Cloud Run ──────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"
      - "--update-secrets=GOOGLE_DRIVE_CLIENT_ID=google-drive-client-id:latest,GOOGLE_DRIVE_CLIENT_SECRET=google-drive-client-secret:latest,GOOGLE_DRIVE_REFRESH_TOKEN=google-drive-refresh-token:latest,GOOGLE_DRIVE_ROOT_FOLDER_ID=google-drive-root-folder-id:latest"

  # ── 3b. Deploy Firestore indexes + Storage rules (parallel with Cloud Run) ─
  - name: node:22
    id: deploy-firebase
    waitFor: [push]
    entrypoint: bash
    args:
      - -c
      - npx --yes firebase-tools@15 deploy --only firestore:indexes,storage --project=$PROJECT_ID --non-interactive

images:
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
