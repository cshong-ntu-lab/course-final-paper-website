# Cloud Build — triggered on push to main.
# Builds the Docker image, pushes to Artifact Registry, deploys to Cloud Run.
#
# Required substitution variables (set in Cloud Build trigger):
#   _REGION                          asia-east1
#   _REGISTRY                        asia-east1-docker.pkg.dev
#   _REPO                            course-final-paper-website
#   _IMAGE                           course-final-paper-website
#   _SERVICE                         course-final-paper-website
#   _SERVICE_ACCOUNT                 course-paper-sa@avid-factor-496115-d6.iam.gserviceaccount.com
#   _ADMIN_EMAILS                    comma-separated admin email addresses
#   _FIREBASE_API_KEY
#   _FIREBASE_AUTH_DOMAIN
#   _FIREBASE_PROJECT_ID
#   _FIREBASE_STORAGE_BUCKET
#   _FIREBASE_MESSAGING_SENDER_ID
#   _FIREBASE_APP_ID

substitutions:
  _REGION: asia-east1
  _REGISTRY: asia-east1-docker.pkg.dev
  _REPO: course-final-paper-website
  _IMAGE: course-final-paper-website
  _SERVICE: course-final-paper-website

steps:
  # ── 1. Build image ───────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"
      - "."

  # ── 2. Push image ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - "--all-tags"
      - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}"

  # ── 3. Deploy to Cloud Run ───────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"
      # Firebase Admin SDK uses Application Default Credentials via the attached
      # service account — no FIREBASE_ADMIN_PRIVATE_KEY_JSON needed.

images:
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:$SHORT_SHA"
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
