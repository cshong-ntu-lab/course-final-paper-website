<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>公開首頁 · 3 directions</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: "Inter", "Noto Sans TC", system-ui, sans-serif;
    --font-serif: "Noto Serif TC", "Source Serif Pro", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;

    /* Forest palette (locked) */
    --accent: #3a5a3a;
    --accent-hover: #2a4429;
    --accent-soft: #ecefe8;
    --paper: #faf9f5;
    --canvas: #f3f2ec;
    --card: #ffffff;
    --fg: #1c1d1a;
    --muted: #5a5a52;
    --subtle: #8e8d83;
    --border: #e5e3d9;
    --border-strong: #cfccc1;
  }
  html, body { background: #f0eee9; font-family: var(--font-sans); color: var(--fg); margin: 0; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="homepage-data.jsx"></script>
<script type="text/babel" src="homepage-shared.jsx"></script>
<script type="text/babel" src="homepage-d1.jsx"></script>
<script type="text/babel" src="homepage-d2.jsx"></script>
<script type="text/babel" src="homepage-d3.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="brief" title="Public homepage" subtitle="3 directions · Forest palette · 用同一份假資料比較">
        <DCArtboard id="readme" label="Read me · 設計考量" width={620} height={1100}>
          <ReadmeCard />
        </DCArtboard>
      </DCSection>

      <DCSection id="dir1" title="Direction 1 · Editorial Index" subtitle="水平 tab nav、中央排版。最接近原 ASCII 線框，最 Substack。">
        <DCArtboard id="d1-desktop" label="Desktop · 1440" width={1280} height={1400}>
          <D1Desktop />
        </DCArtboard>
        <DCArtboard id="d1-mobile" label="Mobile · 375" width={375} height={1100}>
          <D1Mobile />
        </DCArtboard>
      </DCSection>

      <DCSection id="dir2" title="Direction 2 · Sidebar Catalog" subtitle="左側課程目錄、主欄發布列表。可處理 10+ 堂課，最 Notion。">
        <DCArtboard id="d2-desktop" label="Desktop · 1440" width={1280} height={1400}>
          <D2Desktop />
        </DCArtboard>
        <DCArtboard id="d2-mobile" label="Mobile · 375" width={375} height={1100}>
          <D2Mobile />
        </DCArtboard>
      </DCSection>

      <DCSection id="dir3" title="Direction 3 · Reading Room" subtitle="所有課程鋪一頁、章節式 anchor。最 Are.na / Plough Quarterly。">
        <DCArtboard id="d3-desktop" label="Desktop · 1440" width={1280} height={1400}>
          <D3Desktop />
        </DCArtboard>
        <DCArtboard id="d3-mobile" label="Mobile · 375" width={375} height={1100}>
          <D3Mobile />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
