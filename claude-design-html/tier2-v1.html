<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Tier 2 · Workspace + Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: "Inter", "Noto Sans TC", system-ui, sans-serif;
    --font-serif: "Noto Serif TC", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --accent: #3a5a3a; --accent-hover: #2a4429; --accent-soft: #ecefe8;
    --paper: #faf9f5; --canvas: #f3f2ec; --surface: #fff;
    --fg: #1c1d1a; --muted: #5a5a52; --subtle: #8e8d83;
    --border: #e5e3d9; --border-strong: #cfccc1;
    --warning: #b8842c; --warning-soft: #faf2dd;
    --success: #3a5a3a; --success-soft: #ecefe8;
    --danger: #a13c2e; --danger-soft: #fcf3f1;
    --info-strong: #3d5573;
  }
  html, body { background: #f0eee9; font-family: var(--font-sans); color: var(--fg); margin: 0; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">

// ─── Shared ─────────────────────────────────────────
function Wordmark({ size = 14 }) {
  return (
    <a style={{ display: 'inline-flex', alignItems: 'baseline', gap: 8 }}>
      <span style={{ fontFamily: 'var(--font-serif)', fontSize: size + 4, fontWeight: 600, letterSpacing: '-0.01em' }}>研究筆記</span>
      <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--subtle)', letterSpacing: '0.06em' }}>NTU SOC</span>
    </a>
  );
}

function TopBar({ context = 'student', breadcrumb = null }) {
  return (
    <header style={{
      height: 56, background: 'var(--paper)', borderBottom: '1px solid var(--border)',
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '0 28px', position: 'sticky', top: 0,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
        <Wordmark />
        {breadcrumb && (
          <>
            <span style={{ color: 'var(--border-strong)' }}>/</span>
            {breadcrumb}
          </>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
        <a style={{ fontSize: 13, color: 'var(--muted)' }}>{context === 'admin' ? '管理後台' : '我的工作區'}</a>
        <div style={{ width: 28, height: 28, borderRadius: '50%', background: 'var(--accent)', color: '#fff', display: 'grid', placeItems: 'center', fontFamily: 'var(--font-serif)', fontSize: 13, fontWeight: 600 }}>陳</div>
      </div>
    </header>
  );
}

function StatusTag({ kind }) {
  const map = {
    unpub:  { bg: '#f1efe9', border: 'var(--border-strong)', fg: 'var(--muted)', dot: 'var(--subtle)', label: '未發布' },
    pub:    { bg: 'var(--success-soft)', border: '#c8d3c4', fg: '#2a4429', dot: 'var(--accent)', label: '已發布' },
    pubnew: { bg: 'var(--warning-soft)', border: '#e8d4a0', fg: '#7a5a18', dot: 'var(--warning)', label: '已發布 · 有新變更' },
  }[kind];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 6,
      padding: '3px 9px', borderRadius: 4,
      background: map.bg, border: '1px solid ' + map.border, color: map.fg,
      fontSize: 11.5, fontWeight: 500, fontFamily: 'var(--font-sans)',
      letterSpacing: '0.01em', whiteSpace: 'nowrap',
    }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: map.dot }} />
      {map.label}
    </span>
  );
}

function Btn({ variant = 'primary', size = 'md', children, ...rest }) {
  const sizes = { sm: '6px 12px', md: '9px 16px', lg: '11px 20px' };
  const variants = {
    primary: { bg: 'var(--accent)', fg: '#fff', border: 'var(--accent)' },
    secondary: { bg: '#fff', fg: 'var(--fg)', border: 'var(--border-strong)' },
    ghost: { bg: 'transparent', fg: 'var(--muted)', border: 'transparent' },
    danger: { bg: '#fff', fg: 'var(--danger)', border: '#e3b8b0' },
  };
  const v = variants[variant];
  return (
    <button {...rest} style={{
      padding: sizes[size], borderRadius: 5,
      background: v.bg, color: v.fg, border: '1px solid ' + v.border,
      fontSize: size === 'sm' ? 12.5 : 13.5, fontWeight: 500,
      cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6,
      ...rest.style,
    }}>{children}</button>
  );
}

// ─── Read me ─────────────────────────────────────────
function Readme() {
  return (
    <div style={{ background: '#fffef9', padding: 44, height: '100%', boxSizing: 'border-box' }}>
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)', marginBottom: 8 }}>Tier 2 · 5 pages</div>
      <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 32, fontWeight: 600, letterSpacing: '-0.02em', margin: 0, marginBottom: 14 }}>
        Workspace + Admin
      </h1>
      <p style={{ fontFamily: 'var(--font-serif)', fontSize: 15, lineHeight: 1.75, color: 'var(--muted)', margin: 0, marginBottom: 22, textWrap: 'pretty' }}>
        Tier 2 比 Tier 1 簡單也比較沒爭議，所以每頁只做 1 個方向，但會把關鍵 patterns（Status tag 三態、確認 dialog、Course code、Empty state、Skeleton）一次展全。
      </p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, fontSize: 13 }}>
        {[
          ['/workspace', '學生課程卡片，列出他參與的課，連往編輯器'],
          ['/admin', '老師的課程列表，列出他開的課'],
          ['/admin/courses/[id]', '課程設定 + 報告列表（Status tag 三態）'],
          ['/admin/courses/[id]/r/[rid]', '審核頁：Latest / Diff / History tabs + Publish 流程'],
          ['/workspace/settings', '個人設定：作者名稱、Email、刪除帳號（destructive zone）'],
        ].map(([path, desc]) => (
          <div key={path} style={{ borderTop: '1px solid var(--border)', paddingTop: 10 }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--accent)' }}>{path}</div>
            <p style={{ fontFamily: 'var(--font-serif)', fontSize: 13.5, color: 'var(--muted)', margin: '3px 0 0', lineHeight: 1.6 }}>{desc}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── /workspace · student course list ─────────────────
function StudentWorkspace() {
  const courses = [
    { code: 'SOC7841', term: '2026 春', name: '社會研究方法（質性）', teacher: '林志明 副教授', mine: { title: '當代社會變遷下的勞動關係研究', status: 'pubnew', updated: '2 小時前' } },
    { code: 'SOC7522', term: '2026 春', name: '當代社會學理論專題', teacher: '林志明 副教授', mine: { title: '結構功能論的當代回響', status: 'pub', updated: '3 天前' } },
    { code: 'SOC8211', term: '2025 秋', name: '社會階層化研究', teacher: '林志明 副教授', mine: { title: null, status: 'unpub', updated: '昨天' } },
  ];
  return (
    <div style={{ background: 'var(--paper)', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <TopBar context="student" />
      <div style={{ flex: 1, overflow: 'auto', padding: '48px 56px' }}>
        <div style={{ maxWidth: 920, margin: '0 auto' }}>
          <div style={{ marginBottom: 32 }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--subtle)', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: 8 }}>我的工作區</div>
            <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 36, fontWeight: 600, letterSpacing: '-0.02em', margin: 0 }}>三門課，三份報告</h1>
            <p style={{ fontFamily: 'var(--font-serif)', fontSize: 15, color: 'var(--muted)', margin: '6px 0 0' }}>選擇要繼續寫的課程。也可以 <a style={{ color: 'var(--accent)', textDecoration: 'underline', textUnderlineOffset: 3 }}>加入新課程</a>。</p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            {courses.map(c => (
              <a key={c.code} style={{
                display: 'block', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6,
                padding: '20px 22px', cursor: 'pointer',
              }}>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--subtle)', letterSpacing: '0.04em' }}>{c.code} · {c.term}</div>
                </div>
                <div style={{ fontFamily: 'var(--font-serif)', fontSize: 19, fontWeight: 600, letterSpacing: '-0.01em', marginBottom: 4 }}>{c.name}</div>
                <div style={{ fontSize: 12.5, color: 'var(--muted)', marginBottom: 16 }}>{c.teacher}</div>
                <div style={{ borderTop: '1px solid var(--border)', paddingTop: 14 }}>
                  <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)', marginBottom: 6 }}>我的報告</div>
                  {c.mine.title ? (
                    <>
                      <div style={{ fontFamily: 'var(--font-serif)', fontSize: 14, fontWeight: 500, marginBottom: 8, lineHeight: 1.4 }}>{c.mine.title}</div>
                      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                        <StatusTag kind={c.mine.status} />
                        <span style={{ fontSize: 11.5, color: 'var(--subtle)' }}>更新於 {c.mine.updated}</span>
                      </div>
                    </>
                  ) : (
                    <div style={{ fontSize: 13, color: 'var(--subtle)', fontStyle: 'italic' }}>尚未開始 · 點此建立報告</div>
                  )}
                </div>
              </a>
            ))}

            {/* Join new course */}
            <a style={{
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
              background: 'transparent', border: '1px dashed var(--border-strong)', borderRadius: 6,
              padding: '20px 22px', cursor: 'pointer', color: 'var(--muted)',
              minHeight: 196,
            }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 18 }}>+</span>
              <span style={{ fontSize: 13.5 }}>輸入課程代碼加入新課程</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── /admin · teacher course list ─────────────────────
function AdminHome() {
  const courses = [
    { code: 'SOC7841', term: '2026 春', name: '社會研究方法（質性）', students: 18, pending: 4, reports: 16 },
    { code: 'SOC7522', term: '2026 春', name: '當代社會學理論專題', students: 22, pending: 0, reports: 22 },
    { code: 'SOC8211', term: '2025 秋', name: '社會階層化研究', students: 15, pending: 1, reports: 15 },
  ];
  return (
    <div style={{ background: 'var(--paper)', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <TopBar context="admin" />
      <div style={{ flex: 1, overflow: 'auto', padding: '40px 56px' }}>
        <div style={{ maxWidth: 1000, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 28 }}>
            <div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--subtle)', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: 6 }}>管理後台</div>
              <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 30, fontWeight: 600, letterSpacing: '-0.02em', margin: 0 }}>我的課程</h1>
            </div>
            <Btn variant="primary" size="md">＋ 建立新課程</Btn>
          </div>

          {/* table-like list */}
          <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden' }}>
            <div style={{
              display: 'grid', gridTemplateColumns: '120px 1fr 90px 110px 110px',
              padding: '10px 20px', background: 'var(--canvas)', borderBottom: '1px solid var(--border)',
              fontFamily: 'var(--font-mono)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)',
            }}>
              <div>課程代碼</div><div>課程名稱</div><div style={{ textAlign: 'right' }}>學生</div><div style={{ textAlign: 'right' }}>已發布</div><div style={{ textAlign: 'right' }}>待審核</div>
            </div>
            {courses.map((c, i) => (
              <a key={c.code} style={{
                display: 'grid', gridTemplateColumns: '120px 1fr 90px 110px 110px',
                padding: '16px 20px', alignItems: 'center', cursor: 'pointer',
                borderBottom: i < courses.length - 1 ? '1px solid var(--border)' : 'none',
              }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 500 }}>{c.code}</div>
                <div>
                  <div style={{ fontFamily: 'var(--font-serif)', fontSize: 16, fontWeight: 600, lineHeight: 1.3 }}>{c.name}</div>
                  <div style={{ fontSize: 12, color: 'var(--subtle)', marginTop: 2 }}>{c.term}</div>
                </div>
                <div style={{ textAlign: 'right', fontFamily: 'var(--font-mono)', fontSize: 14 }}>{c.students}</div>
                <div style={{ textAlign: 'right', fontFamily: 'var(--font-mono)', fontSize: 14, color: 'var(--muted)' }}>{c.reports}</div>
                <div style={{ textAlign: 'right' }}>
                  {c.pending > 0 ? (
                    <span style={{
                      display: 'inline-flex', alignItems: 'center', gap: 5, padding: '2px 8px', borderRadius: 4,
                      background: 'var(--warning-soft)', color: '#7a5a18', border: '1px solid #e8d4a0',
                      fontSize: 11.5, fontWeight: 500,
                    }}>
                      <span style={{ width: 5, height: 5, borderRadius: '50%', background: 'var(--warning)' }} />
                      {c.pending} 待審
                    </span>
                  ) : (
                    <span style={{ fontSize: 12, color: 'var(--subtle)' }}>—</span>
                  )}
                </div>
              </a>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── /admin/courses/[id] · course settings + reports ──
function CourseAdmin() {
  const reports = [
    { author: '陳沛縈', title: '當代社會變遷下的勞動關係研究', status: 'pubnew', updated: '2 小時前', published: '2026-04-12' },
    { author: '林子瑄', title: '田野工作中的研究者位置反思', status: 'pub', updated: '3 天前', published: '2026-04-08' },
    { author: '王翊辰', title: '訪談法在數位社群研究中的限制', status: 'pubnew', updated: '昨天', published: '2026-03-30' },
    { author: '黃詩涵', title: null, status: 'unpub', updated: '上週', published: null },
    { author: '張為閔', title: '紮根理論的編碼實踐', status: 'pub', updated: '一週前', published: '2026-04-05' },
  ];
  return (
    <div style={{ background: 'var(--paper)', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <TopBar context="admin" breadcrumb={
        <span style={{ fontSize: 13, color: 'var(--muted)' }}>
          <a style={{ color: 'var(--muted)' }}>我的課程</a>
          <span style={{ margin: '0 8px', color: 'var(--border-strong)' }}>/</span>
          <span style={{ color: 'var(--fg)' }}>社會研究方法（質性）</span>
        </span>
      } />
      <div style={{ flex: 1, overflow: 'auto', padding: '36px 48px' }}>
        <div style={{ maxWidth: 1040, margin: '0 auto' }}>
          {/* header */}
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 26 }}>
            <div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, color: 'var(--subtle)', marginBottom: 4 }}>SOC7841 · 2026 春</div>
              <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 28, fontWeight: 600, letterSpacing: '-0.02em', margin: 0 }}>社會研究方法（質性）</h1>
            </div>
            <Btn variant="secondary" size="sm">編輯課程資訊</Btn>
          </div>

          {/* course code card */}
          <div style={{
            background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6,
            padding: '18px 22px', marginBottom: 32, display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          }}>
            <div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)', marginBottom: 4 }}>邀請學生用此代碼加入</div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 26, fontWeight: 600, letterSpacing: '0.12em', color: 'var(--accent)' }}>SOC784</div>
            </div>
            <div style={{ display: 'flex', gap: 8 }}>
              <Btn variant="secondary" size="sm">複製</Btn>
              <Btn variant="ghost" size="sm">重新產生</Btn>
            </div>
          </div>

          {/* reports section */}
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 14 }}>
            <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: 20, fontWeight: 600, margin: 0 }}>學生報告</h2>
            <div style={{ fontSize: 12.5, color: 'var(--subtle)' }}>共 18 位學生 · 5 份報告 · 2 份待審核</div>
          </div>

          <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden' }}>
            <div style={{
              display: 'grid', gridTemplateColumns: '120px 1fr 180px 120px',
              padding: '10px 20px', background: 'var(--canvas)', borderBottom: '1px solid var(--border)',
              fontFamily: 'var(--font-mono)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)',
            }}>
              <div>作者</div><div>報告</div><div>狀態</div><div style={{ textAlign: 'right' }}>最近更新</div>
            </div>
            {reports.map((r, i) => (
              <a key={i} style={{
                display: 'grid', gridTemplateColumns: '120px 1fr 180px 120px',
                padding: '14px 20px', alignItems: 'center', cursor: 'pointer',
                borderBottom: i < reports.length - 1 ? '1px solid var(--border)' : 'none',
              }}>
                <div style={{ fontFamily: 'var(--font-serif)', fontSize: 14, fontWeight: 500 }}>{r.author}</div>
                <div style={{ fontFamily: 'var(--font-serif)', fontSize: 14.5, color: r.title ? 'var(--fg)' : 'var(--subtle)', fontStyle: r.title ? 'normal' : 'italic', lineHeight: 1.4 }}>
                  {r.title || '（尚未開始）'}
                </div>
                <div><StatusTag kind={r.status} /></div>
                <div style={{ textAlign: 'right', fontSize: 12, color: 'var(--subtle)' }}>{r.updated}</div>
              </a>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── /admin/courses/[id]/r/[rid] · review page ─────────
function ReviewPage() {
  return (
    <div style={{ background: 'var(--paper)', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <TopBar context="admin" breadcrumb={
        <span style={{ fontSize: 13, color: 'var(--muted)' }}>
          <a style={{ color: 'var(--muted)' }}>SOC7841</a>
          <span style={{ margin: '0 8px', color: 'var(--border-strong)' }}>/</span>
          <span style={{ color: 'var(--fg)' }}>陳沛縈的報告</span>
        </span>
      } />
      <div style={{ flex: 1, overflow: 'auto', padding: '28px 48px' }}>
        <div style={{ maxWidth: 1040, margin: '0 auto' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 18, gap: 24 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
                <StatusTag kind="pubnew" />
                <span style={{ fontSize: 12, color: 'var(--subtle)' }}>· 上次發布 2026-04-12 · 學生 8 小時前更新</span>
              </div>
              <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 26, fontWeight: 600, letterSpacing: '-0.015em', margin: 0, lineHeight: 1.25 }}>
                當代社會變遷下的勞動關係研究：以平台外送員為例
              </h1>
              <div style={{ fontSize: 13, color: 'var(--muted)', marginTop: 6 }}>作者　陳沛縈</div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
              <Btn variant="secondary" size="md">取消發布</Btn>
              <Btn variant="primary" size="md">發布新版本</Btn>
            </div>
          </div>

          {/* Tabs */}
          <div style={{ borderBottom: '1px solid var(--border)', display: 'flex', gap: 28, marginBottom: 20 }}>
            {[
              ['Latest', false],
              ['Diff', true],
              ['History', false],
            ].map(([t, active]) => (
              <a key={t} style={{
                padding: '10px 0', fontSize: 13.5, fontWeight: 500,
                color: active ? 'var(--fg)' : 'var(--muted)',
                borderBottom: active ? '2px solid var(--accent)' : '2px solid transparent',
                marginBottom: -1, cursor: 'pointer',
              }}>
                {t}{t === 'Diff' && <span style={{ marginLeft: 6, fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--warning)', background: 'var(--warning-soft)', padding: '1px 6px', borderRadius: 3 }}>+12 / -4</span>}
              </a>
            ))}
          </div>

          {/* Sub-tabs */}
          <div style={{ display: 'flex', gap: 4, marginBottom: 16 }}>
            {['Source', 'Rendered'].map((t, i) => (
              <button key={t} style={{
                padding: '5px 12px', borderRadius: 4,
                background: i === 0 ? 'var(--canvas)' : 'transparent',
                color: i === 0 ? 'var(--fg)' : 'var(--muted)',
                border: '1px solid ' + (i === 0 ? 'var(--border-strong)' : 'transparent'),
                fontSize: 12, cursor: 'pointer',
              }}>{t}</button>
            ))}
          </div>

          {/* Diff viewer mock */}
          <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 6, fontFamily: 'var(--font-mono)', fontSize: 12.5, lineHeight: 1.65, overflow: 'hidden' }}>
            {[
              ['line', 12, 12, '## 三、研究方法', null],
              ['line', 13, 13, '', null],
              ['del', 14, null, '本研究採用半結構式訪談，訪談 8 位外送員。', 'del'],
              ['ins', null, 14, '本研究採用半結構式訪談法，於 2025 年 9 月至 12 月間訪談 12 位平台外送員，', 'ins'],
              ['ins', null, 15, '其中 8 位來自 Uber Eats、4 位來自 foodpanda。每位受訪者訪談時間 60–90 分鐘。', 'ins'],
              ['line', 15, 16, '', null],
              ['line', 16, 17, '訪談大綱涵蓋三大面向：勞動條件、自我認同、平台演算法經驗。', null],
              ['del', 17, null, '所有訪談皆經受訪者同意錄音。', 'del'],
              ['ins', null, 18, '所有訪談皆經受訪者書面同意錄音，並於訪談後 7 日內完成逐字稿轉錄。', 'ins'],
            ].map((row, i) => {
              const [kind, ln1, ln2, text, color] = row;
              const bg = color === 'ins' ? '#eef5ec' : color === 'del' ? '#fbeeec' : 'transparent';
              const mark = color === 'ins' ? '+' : color === 'del' ? '−' : ' ';
              const markColor = color === 'ins' ? '#3a5a3a' : color === 'del' ? '#a13c2e' : 'var(--subtle)';
              return (
                <div key={i} style={{ display: 'grid', gridTemplateColumns: '38px 38px 18px 1fr', background: bg, borderBottom: i < 8 ? '1px solid #f1efe9' : 'none' }}>
                  <div style={{ padding: '3px 8px', textAlign: 'right', color: 'var(--subtle)', borderRight: '1px solid #f1efe9' }}>{ln1 || ''}</div>
                  <div style={{ padding: '3px 8px', textAlign: 'right', color: 'var(--subtle)', borderRight: '1px solid #f1efe9' }}>{ln2 || ''}</div>
                  <div style={{ padding: '3px 0 3px 8px', color: markColor, fontWeight: 600 }}>{mark}</div>
                  <div style={{ padding: '3px 14px 3px 4px', color: 'var(--fg)', fontFamily: 'var(--font-sans)' }}>{text}</div>
                </div>
              );
            })}
            <div style={{ padding: '8px 16px', fontSize: 11, color: 'var(--subtle)', background: 'var(--canvas)' }}>… 共 16 處變更</div>
          </div>
        </div>
      </div>

      {/* Confirm dialog overlay */}
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(28, 29, 26, 0.45)', display: 'grid', placeItems: 'center', pointerEvents: 'none' }}>
        <div style={{
          background: '#fff', borderRadius: 8, width: 440, padding: '24px 26px',
          boxShadow: '0 24px 60px rgba(0,0,0,0.18)', border: '1px solid var(--border)',
        }}>
          <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: 19, fontWeight: 600, margin: 0, marginBottom: 8 }}>發布新版本？</h3>
          <p style={{ fontSize: 13.5, color: 'var(--muted)', lineHeight: 1.7, margin: 0, marginBottom: 18 }}>
            學生最新的草稿將取代目前的公開版本。已發布的舊版會保留在 History 中，可隨時回復。
          </p>
          <div style={{ background: 'var(--canvas)', padding: '10px 14px', borderRadius: 5, fontSize: 12.5, color: 'var(--muted)', marginBottom: 20, display: 'flex', justifyContent: 'space-between' }}>
            <span>變更摘要</span>
            <span style={{ fontFamily: 'var(--font-mono)' }}>+12 行 · −4 行 · 16 處</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8 }}>
            <Btn variant="ghost" size="md">取消</Btn>
            <Btn variant="primary" size="md">確認發布</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── /workspace/settings ───────────────────────────────
function Settings() {
  return (
    <div style={{ background: 'var(--paper)', height: '100%', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
      <TopBar context="student" />
      <div style={{ flex: 1, overflow: 'auto', padding: '40px 48px' }}>
        <div style={{ maxWidth: 640, margin: '0 auto' }}>
          <div style={{ marginBottom: 32 }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--subtle)', textTransform: 'uppercase', letterSpacing: '0.12em', marginBottom: 6 }}>個人設定</div>
            <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: 28, fontWeight: 600, letterSpacing: '-0.02em', margin: 0 }}>帳號 & 個人資訊</h1>
          </div>

          {/* Profile section */}
          <section style={{ marginBottom: 36 }}>
            <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: 17, fontWeight: 600, margin: '0 0 12px', paddingBottom: 8, borderBottom: '1px solid var(--border)' }}>公開資訊</h2>
            <FormRow label="作者名稱" help="會出現在你公開報告上的署名。可與 Google 帳號名稱不同。">
              <input defaultValue="陳沛縈" style={{ width: '100%', padding: '9px 12px', border: '1px solid var(--border-strong)', borderRadius: 5, fontSize: 14, fontFamily: 'inherit', outline: 'none' }} />
            </FormRow>
            <FormRow label="Email">
              <div style={{ padding: '9px 12px', background: 'var(--canvas)', border: '1px solid var(--border)', borderRadius: 5, fontSize: 14, color: 'var(--muted)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span>r12325001@ntu.edu.tw</span>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, color: 'var(--subtle)' }}>由 Google 提供，無法變更</span>
              </div>
            </FormRow>
            <div style={{ marginTop: 14 }}>
              <Btn variant="primary" size="md">儲存變更</Btn>
            </div>
          </section>

          {/* Danger zone */}
          <section>
            <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: 17, fontWeight: 600, margin: '0 0 12px', paddingBottom: 8, borderBottom: '1px solid var(--border)', color: 'var(--danger)' }}>危險區</h2>
            <div style={{ background: 'var(--danger-soft)', border: '1px solid #e3b8b0', borderRadius: 6, padding: '16px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 500, color: '#7a2828', marginBottom: 3 }}>刪除我的帳號</div>
                <div style={{ fontSize: 12.5, color: 'var(--muted)', lineHeight: 1.6 }}>所有已發布的報告會被移除、所有上傳的圖片會被刪除。此操作無法復原。</div>
              </div>
              <Btn variant="danger" size="md" style={{ flexShrink: 0 }}>刪除帳號…</Btn>
            </div>
          </section>
        </div>
      </div>
    </div>
  );
}

function FormRow({ label, help, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <label style={{ display: 'block', fontFamily: 'var(--font-mono)', fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.08em', color: 'var(--subtle)', marginBottom: 6 }}>{label}</label>
      {children}
      {help && <p style={{ fontSize: 12, color: 'var(--subtle)', margin: '6px 0 0', lineHeight: 1.6 }}>{help}</p>}
    </div>
  );
}

// ─── App ─────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection id="readme" title="Tier 2 overview">
        <DCArtboard id="readme" label="Read me" width={560} height={620}><Readme /></DCArtboard>
      </DCSection>
      <DCSection id="student" title="Student workspace · /workspace + /workspace/settings">
        <DCArtboard id="ws" label="/workspace" width={1280} height={780}><StudentWorkspace /></DCArtboard>
        <DCArtboard id="settings" label="/workspace/settings" width={1280} height={780}><Settings /></DCArtboard>
      </DCSection>
      <DCSection id="admin" title="Admin · /admin · /admin/courses/[id] · review">
        <DCArtboard id="admin" label="/admin" width={1280} height={780}><AdminHome /></DCArtboard>
        <DCArtboard id="course" label="/admin/courses/[id]" width={1280} height={920}><CourseAdmin /></DCArtboard>
        <DCArtboard id="review" label="/admin/courses/[id]/r/[rid] · Diff + Publish dialog" width={1280} height={920}><ReviewPage /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
