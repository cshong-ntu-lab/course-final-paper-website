# Cloud Build — triggered on feat/fix/docs branch pushes.
# Builds the Docker image and deploys to the shared test Cloud Run service.
# The test service points at a separate Firebase project (isolated test data).
#
# Required substitution variables (set in the 'deploy-test' Cloud Build trigger):
#   _ADMIN_EMAILS                    comma-separated admin email addresses
#   _FIREBASE_API_KEY                test Firebase project
#   _FIREBASE_AUTH_DOMAIN            test Firebase project
#   _FIREBASE_PROJECT_ID             test Firebase project
#   _FIREBASE_STORAGE_BUCKET         test Firebase project
#   _FIREBASE_MESSAGING_SENDER_ID    test Firebase project
#   _FIREBASE_APP_ID                 test Firebase project
#
# One-time setup (manual):
#   The main service account (course-paper-sa@avid-factor-496115-d6.iam.gserviceaccount.com)
#   needs Firebase Admin access on the test project so ADC works cross-project:
#     gcloud projects add-iam-policy-binding <TEST_PROJECT_ID> \
#       --member="serviceAccount:course-paper-sa@avid-factor-496115-d6.iam.gserviceaccount.com" \
#       --role="roles/firebase.admin"

substitutions:
  _REGION: asia-east1
  _REGISTRY: asia-east1-docker.pkg.dev
  _REPO: course-final-paper-website
  _IMAGE: course-final-paper-website
  _SERVICE: course-paper-test
  _SERVICE_ACCOUNT: course-paper-sa@avid-factor-496115-d6.iam.gserviceaccount.com

steps:
  # ── 1. Build image ───────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"
      - "."

  # ── 2. Push image ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"

  # ── 3. Deploy to test Cloud Run ──────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"
      # Firebase Admin SDK connects to test Firebase project via ADC.
      # The service account must have roles/firebase.admin on the test project
      # (see one-time setup comment at the top of this file).

images:
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
