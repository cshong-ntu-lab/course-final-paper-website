# Cloud Build — triggered on feat/fix/docs branch pushes.
# Builds the Docker image and deploys to the shared test Cloud Run service.
# The test service points at a separate Firebase project (isolated test data).
#
# Non-secret substitutions are managed in infra/cloud-build.tf (Terraform).
# Test Firebase API keys are read from Secret Manager via availableSecrets below.
#
# After first terraform apply, populate secret values:
#   echo -n "VALUE" | gcloud secrets versions add firebase-test-api-key \
#     --data-file=- --project=avid-factor-496115-d6
#   (repeat for all 6 firebase-test-* secrets)
#
# One-time IAM setup (managed by Terraform in infra/iam.tf):
#   course-paper-sa needs roles/firebase.admin and roles/serviceusage.serviceUsageConsumer
#   on the test Firebase project — see infra/iam.tf for the resource definitions.

substitutions:
  _REGION: asia-east1
  _REGISTRY: asia-east1-docker.pkg.dev
  _REPO: course-final-paper-website
  _IMAGE: course-final-paper-website
  _SERVICE: course-paper-test
  _SERVICE_ACCOUNT: course-paper-sa@avid-factor-496115-d6.iam.gserviceaccount.com

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-api-key/versions/latest
      env: FIREBASE_TEST_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-auth-domain/versions/latest
      env: FIREBASE_TEST_AUTH_DOMAIN
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-project-id/versions/latest
      env: FIREBASE_TEST_PROJECT_ID
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-storage-bucket/versions/latest
      env: FIREBASE_TEST_STORAGE_BUCKET
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-messaging-sender-id/versions/latest
      env: FIREBASE_TEST_MESSAGING_SENDER_ID
    - versionName: projects/$PROJECT_ID/secrets/firebase-test-app-id/versions/latest
      env: FIREBASE_TEST_APP_ID

steps:
  # ── 1. Build image ───────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    secretEnv:
      - FIREBASE_TEST_API_KEY
      - FIREBASE_TEST_AUTH_DOMAIN
      - FIREBASE_TEST_PROJECT_ID
      - FIREBASE_TEST_STORAGE_BUCKET
      - FIREBASE_TEST_MESSAGING_SENDER_ID
      - FIREBASE_TEST_APP_ID
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$$FIREBASE_TEST_API_KEY"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$$FIREBASE_TEST_AUTH_DOMAIN"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$$FIREBASE_TEST_PROJECT_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$$FIREBASE_TEST_STORAGE_BUCKET"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_TEST_MESSAGING_SENDER_ID"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$$FIREBASE_TEST_APP_ID"
      - "-t=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"
      - "."

  # ── 2. Push image ────────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"

  # ── 3a. Deploy to test Cloud Run ─────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--service-account=${_SERVICE_ACCOUNT}"
      - "--allow-unauthenticated"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"
      # Firebase Admin SDK connects to test Firebase project via ADC.
      # IAM grants are managed in infra/iam.tf.

  # ── 3b. Deploy Firestore indexes to test project (parallel with Cloud Run) ─
  - name: node:22
    id: deploy-indexes
    waitFor: [push]
    secretEnv: [FIREBASE_TEST_PROJECT_ID]
    entrypoint: bash
    args:
      - -c
      - npx --yes firebase-tools@15 deploy --only firestore:indexes --project=$$FIREBASE_TEST_PROJECT_ID --non-interactive

images:
  - "${_REGISTRY}/$PROJECT_ID/${_REPO}/${_IMAGE}:test-$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
