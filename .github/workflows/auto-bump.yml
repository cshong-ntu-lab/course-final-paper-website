name: auto-bump

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump-tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: next
        run: |
          latest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            latest="0.0.0"
          fi
          IFS='.' read -r major minor patch <<< "$latest"
          new_tag="${major}.${minor}.$((patch + 1))"
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest} → ${new_tag}"

      - name: Tag merge commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.next.outputs.tag }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "${{ steps.next.outputs.tag }}"
